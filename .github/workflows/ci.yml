name: CI

on:
  push:
    branches: [main, dev]
  # Every PR, whatever its base: stacked PRs target the branch of the PR below them.
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/ci/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  # The database side (SQL functions, RLS, storage, migrations) and the browser journeys,
  # against a local Supabase built from supabase/migrations, as on a developer's machine.
  supabase:
    name: integration & e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Applies every migration on an empty database: a broken migration fails here,
      # not on `npm run db:migrate` in production.
      - name: Start local Supabase
        run: npx supabase start -x studio,postgres-meta,mailpit,imgproxy,supavisor

      # Local demo keys (the same on every machine), not secrets.
      - name: Point the app and the tests at it
        run: |
          npx supabase status -o env \
            | sed -n -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p' \
                     -e 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/p' \
                     -e 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      - run: npm run test:integration

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Keep Playwright traces of failed journeys
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
